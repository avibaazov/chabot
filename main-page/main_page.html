<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot Dashboard</title>
    <link rel="stylesheet" href="/main-page/mainPage.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="top-header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🤖</span>
                <span class="logo-text">ChatBot Platform</span>
            </div>
            <button class="logout-button">Logout</button>
        </div>
    </header>
    
    <div class="container">
        <div class="welcome-section">
            <h1>Dashboard</h1>
            <p class="subtitle">Manage and monitor your chatbots</p>
        </div>
        
        <div class="stats-card">
            <h2 id="botsCount">Loading...</h2>
        </div>
        
        <div class="actions-section">
            <button class="button" id="createBotButton">+ Create New Bot</button>
        </div>
        
        <div class="botsContainer" id="botsContainer"></div>
    </div>
    
    <script src="/main-page/mainPage.js"></script>
</body>
</html>
